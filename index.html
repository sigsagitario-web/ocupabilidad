<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ocupabilidad · Transportes Sagitario</title>
<style>
  :root{
    --bg:#0f1922; --panel:#16242f; --panel2:#1d3140; --line:#2a4254;
    --ink:#eef4f7; --muted:#8fa8b8; --dim:#5f7788;
    --amber:#f2a900; --amber-d:#c98a00;
    --green:#2fbf71; --green-d:#1d9d58;
    --red:#e5484d; --blue:#4a9fd4; --violet:#8b7fd4;
    --r:14px; --tap:56px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;padding-bottom:120px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}

  header{position:sticky;top:0;z-index:50;
    background:linear-gradient(180deg,#0f1922 72%,rgba(15,25,34,0));padding:14px 14px 10px}
  .brandrow{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto}
  .mark{width:38px;height:38px;border-radius:9px;flex:0 0 auto;background:var(--amber);color:#111;
    display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-1px;box-shadow:0 2px 0 var(--amber-d)}
  .brandtxt h1{font-size:15px;margin:0;font-weight:700}
  .brandtxt p{font-size:11px;margin:1px 0 0;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}
  .modepill{margin-left:auto;font-size:11px;font-weight:800;padding:6px 11px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.6px}
  .modepill.cond{background:rgba(47,191,113,.16);color:var(--green);border:1px solid rgba(47,191,113,.35)}
  .modepill.sup{background:rgba(139,127,212,.16);color:var(--violet);border:1px solid rgba(139,127,212,.4)}

  .steps{display:flex;gap:6px;margin:12px auto 0;max-width:560px}
  .step{flex:1;height:4px;border-radius:2px;background:var(--line);transition:.3s}
  .step.done{background:var(--amber)} .step.cur{background:var(--green)}

  section.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;margin:14px 0}
  .card-h{display:flex;align-items:baseline;gap:9px;margin:0 0 14px}
  .card-n{font-size:11px;font-weight:800;color:#0f1922;background:var(--amber);width:22px;height:22px;
    border-radius:6px;display:grid;place-items:center;flex:0 0 auto;transform:translateY(-1px)}
  .card-h h2{font-size:15px;margin:0;font-weight:700}
  .card-h .sub{font-size:12px;color:var(--muted);margin-left:auto;font-weight:600}

  label.fld{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 0 7px}
  label.fld .req{color:var(--amber)}
  .hint{font-size:12px;color:var(--dim);margin:6px 0 0;line-height:1.35}

  select.big{width:100%;height:var(--tap);background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);
    border-radius:11px;font-size:16px;font-weight:600;padding:0 42px 0 15px;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24' fill='none' stroke='%238fa8b8' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center}
  select.big:focus{outline:none;border-color:var(--amber);background-color:#213747}
  select.big:disabled{opacity:.4} select.big.filled{border-color:var(--green)}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:var(--tap);flex:1 1 calc(50% - 4px);background:var(--panel2);border:1.5px solid var(--line);
    border-radius:11px;color:var(--ink);font-size:15px;font-weight:700;padding:8px 10px;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.12s}
  .chip small{font-size:11px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
  .chip:active{transform:scale(.97)}
  .chip.on{background:var(--amber);border-color:var(--amber);color:#111}
  .chip.on small{color:#5a4300}
  .chip.wide{flex:1 1 100%}
  .chip.dir.on{background:var(--blue);border-color:var(--blue);color:#fff} .chip.dir.on small{color:#d5ecf8}
  .chip.turno.on{background:var(--violet);border-color:var(--violet);color:#fff} .chip.turno.on small{color:#e3dffa}

  /* paraderos: fila embarque/desembarque */
  .par{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin:10px 0}
  .par.filled{border-color:var(--green)}
  .par-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .par-ord{width:22px;height:22px;flex:0 0 auto;border-radius:6px;background:var(--line);color:var(--ink);
    font-size:11px;font-weight:800;display:grid;place-items:center}
  .par-name{font-size:13.5px;font-weight:700;line-height:1.2}
  .par-rows{display:flex;gap:8px}
  .par-cell{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
  .par-cell .pl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:5px;text-align:center}
  .par-cell.emb .pl{color:var(--green)} .par-cell.des .pl{color:var(--blue)}
  .stepline{display:flex;align-items:center;gap:6px}
  .sbtn{width:38px;height:40px;flex:0 0 auto;border-radius:8px;border:none;font-size:22px;font-weight:600;
    display:grid;place-items:center;cursor:pointer;line-height:1;user-select:none;background:var(--line);color:var(--ink)}
  .sbtn:active{transform:scale(.9)}
  .sbtn.plus{background:var(--amber);color:#111}
  .sin{flex:1;min-width:0;width:100%;height:40px;text-align:center;background:transparent;border:none;
    color:var(--ink);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
  .sin:focus{outline:none}

  .gauge{background:linear-gradient(180deg,#12202b,#0e1a23);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-top:12px}
  .gauge-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
  .gauge-lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .gauge-val{font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .gauge-val small{font-size:13px;color:var(--muted);font-weight:600}
  .bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:6px;transition:width .35s cubic-bezier(.4,0,.2,1),background .35s;width:0}
  .bar-100{position:absolute;top:-3px;bottom:-3px;left:100%;width:2px;background:var(--muted);opacity:.5}
  .gtags{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
  .gtag{font-size:12px;color:var(--muted)} .gtag b{color:var(--ink);font-weight:700}

  .review{font-size:14px}
  .rrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
  .rrow:last-child{border:none}
  .rk{color:var(--muted);font-weight:600} .rv{font-weight:700;text-align:right}

  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:linear-gradient(0deg,#0f1922 78%,rgba(15,25,34,0));padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
  .actionbar .wrap{display:flex;gap:10px}
  .btn{flex:1;height:var(--tap);border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--green);color:#04160c;box-shadow:0 3px 0 var(--green-d)}
  .btn-primary:disabled{background:var(--line);color:var(--dim);box-shadow:none}
  .btn-ghost{flex:0 0 auto;width:var(--tap);background:var(--panel2);color:var(--ink);border:1.5px solid var(--line)}
  .btn-amber{background:var(--amber);color:#111;box-shadow:0 3px 0 var(--amber-d)}
  .btn-violet{background:var(--violet);color:#fff}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--green);
    color:#04160c;font-weight:800;font-size:15px;padding:13px 22px;border-radius:12px;z-index:80;opacity:0;
    pointer-events:none;transition:.28s;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red);color:#fff}

  .savedbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;margin:14px 0}
  .savedbar .cnt{font-size:22px;font-weight:800;color:var(--green)}
  .savedbar .lbl{font-size:12px;color:var(--muted);line-height:1.3} .savedbar .lbl b{color:var(--ink)}
  .linkbtn{margin-left:auto;background:none;border:1px solid var(--line);color:var(--amber);font-size:13px;
    font-weight:700;padding:9px 13px;border-radius:9px;cursor:pointer}

  .hidden{display:none!important}
  .fadein{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* login perfil */
  .gate{max-width:400px;margin:8vh auto 0;padding:0 20px;text-align:center}
  .gate .mark{width:64px;height:64px;font-size:30px;border-radius:16px;margin:0 auto 18px}
  .gate h2{font-size:22px;margin:0 0 6px}
  .gate p{color:var(--muted);font-size:14px;margin:0 0 28px}
  .rolebtns{display:flex;flex-direction:column;gap:12px}
  .rolebtn{height:64px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:14px;padding:0 20px;text-align:left}
  .rolebtn:active{transform:scale(.98)}
  .rolebtn .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
  .rolebtn.cond .ic{background:rgba(47,191,113,.16);color:var(--green)}
  .rolebtn.sup .ic{background:rgba(139,127,212,.16);color:var(--violet)}
  .rolebtn small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px}
  .pinbox{display:flex;gap:8px;justify-content:center;margin:22px 0}
  .pindig{width:52px;height:60px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);
    color:var(--ink);font-size:26px;font-weight:800;text-align:center}
  .pindig:focus{outline:none;border-color:var(--violet)}

  /* supervisor: tarjetas de registro */
  .filtro{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
  .fbtn{flex:0 0 auto;padding:9px 15px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel2);
    color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  .fbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
  .regc{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:11px 0}
  .regc.aprob{border-color:rgba(47,191,113,.4)}
  .regc-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .regc-cod{font-size:15px;font-weight:800}
  .regc-oc{margin-left:auto;font-size:16px;font-weight:800}
  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px}
  .badge.pend{background:rgba(242,169,0,.16);color:var(--amber)}
  .badge.aprob{background:rgba(47,191,113,.16);color:var(--green)}
  .regc-m{font-size:13px;color:var(--muted);line-height:1.5}
  .regc-m b{color:var(--ink);font-weight:700}
  .regc-acts{display:flex;gap:8px;margin-top:11px}
  .regc-acts button{flex:1;height:44px;border-radius:10px;border:none;font-size:14px;font-weight:800;cursor:pointer}
  .ba{background:var(--green);color:#04160c} .be{background:var(--panel2);color:var(--ink);border:1.5px solid var(--line)!important}

  .kpis{display:flex;gap:10px;margin:14px 0}
  .kpi{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 12px;text-align:center}
  .kpi .n{font-size:26px;font-weight:800;line-height:1} .kpi .l{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}
  .kpi.g .n{color:var(--green)} .kpi.a .n{color:var(--amber)} .kpi.b .n{color:var(--blue)}

  .modal{position:fixed;inset:0;z-index:90;background:rgba(6,12,17,.72);display:none;align-items:flex-end}
  .modal.show{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;
    max-height:86vh;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:none}
  .sheet-h{padding:16px 16px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .sheet-h h3{margin:0;font-size:16px;flex:1}
  .sheet-body{overflow-y:auto;padding:12px 14px 24px}
  .xbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:20px;cursor:pointer}
  .empty{text-align:center;color:var(--dim);padding:34px 10px;font-size:14px}

  .srcnote{font-size:11px;color:var(--dim);text-align:center;padding:8px 0 0}
  .srcnote b{color:var(--muted)}
</style>
</head>
<body>
<header id="hdr" class="hidden">
  <div class="brandrow">
    <div class="mark">TS</div>
    <div class="brandtxt"><h1>Registro de Ocupabilidad</h1><p>Transportes Sagitario</p></div>
    <span class="modepill" id="modepill"></span>
  </div>
  <div class="steps" id="steps"></div>
</header>

<main class="wrap" id="app"></main>

<div class="actionbar hidden" id="abar"><div class="wrap" id="actions"></div></div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-h"><h3 id="modalTitle">Detalle</h3><button class="xbtn" onclick="cerrarModal()">✕</button></div>
    <div class="sheet-body" id="modalBody"></div>
  </div>
</div>

<script>
/* =========================================================
   Ocupabilidad · Transportes Sagitario · v3
   Login Microsoft (MSAL) + SharePoint via Graph
   Identidad automática por correo · roles por correo
   ========================================================= */

// ============ CONFIGURACIÓN — completar tras registrar en Azure ============
const CONFIG = {
  clientId:  "c8bb2957-639f-4d20-9a66-ca890cff99d8",          // ← del registro de app en Azure
  tenantId:  "28c94e56-38e4-4194-a9c7-e3fd46d7b8e5",          // ← del registro de app en Azure
  // Sitio y listas de SharePoint
  spHost:    "transportessagitariosrl050.sharepoint.com",
  spPath:    "/sites/Sitiodeapps",
  listas: { conductores:"Conductores", rutas:"Rutas", paraderos:"Paraderos",
            registros:"Registros", detalle:"DetalleParaderos",
            puntosalmuerzo:"PuntosAlmuerzo", programacion:"ProgramacionDiaria" },
  // Correos de rol
  adminEmail:      "davidizquierdoteran@transportessagitariosrl050.onmicrosoft.com",
  supervisorEmail: "operaciones@transportessagitariosrl050.onmicrosoft.com",
};
// Permisos que la app pedirá al usuario
const GRAPH_SCOPES = ["User.Read","Sites.ReadWrite.All"];

// Si no hay clientId configurado, la app corre en MODO DEMO (datos locales, sin login real)
const MODO_DEMO = CONFIG.clientId.startsWith("PEGAR");

// ============ ESTADO ============
let msal=null, CUENTA=null, TOKEN=null, SITE_ID=null, LIST_IDS={};
let ROL=null, USUARIO={nombre:'',email:''};
let DATA={ sites:SITES, rutas:RUTAS, conductores:[] };
let PROGRAMACION=null; // {fecha, items:[{codigo,placa,estado,turno,...}]}
let ORIGEN='local';
let F=nuevoRegistro(), PANTALLA=0, REGISTROS=[], FILTRO_SUP='todos', VISTA_SUP='validar';

// ============ MSAL ============
function initMsal(){
  const lib = window.msal; // la librería MSAL se expone en window.msal
  if(!lib || !lib.PublicClientApplication){
    console.error('MSAL no se cargó (revisa la conexión o el bloqueo de scripts).');
    return false;
  }
  msal = new lib.PublicClientApplication({
    auth:{ clientId:CONFIG.clientId, authority:`https://login.microsoftonline.com/${CONFIG.tenantId}`,
           redirectUri: location.origin+location.pathname },
    cache:{ cacheLocation:"localStorage", storeAuthStateInCookie:false } // recuerda sesión en el navegador
  });
  return true;
}
async function loginMS(){
  try{
    await msal.initialize();
    const resp=await msal.loginPopup({scopes:GRAPH_SCOPES});
    CUENTA=resp.account;
    await trasLogin();
  }catch(e){ toast('No se pudo iniciar sesión','err'); console.error(e); }
}
async function trySilentLogin(){
  if(MODO_DEMO) return false;
  try{
    await msal.initialize();
    const cuentas=msal.getAllAccounts();
    if(!cuentas.length) return false;
    CUENTA=cuentas[0];
    const r=await msal.acquireTokenSilent({scopes:GRAPH_SCOPES,account:CUENTA});
    TOKEN=r.accessToken;
    await trasLogin(true);
    return true;
  }catch(e){ return false; }
}
async function getToken(){
  const r=await msal.acquireTokenSilent({scopes:GRAPH_SCOPES,account:CUENTA});
  TOKEN=r.accessToken; return TOKEN;
}
async function trasLogin(silent){
  if(!silent){ const r=await msal.acquireTokenSilent({scopes:GRAPH_SCOPES,account:CUENTA}); TOKEN=r.accessToken; }
  USUARIO.email=(CUENTA.username||'').toLowerCase();
  USUARIO.nombre=CUENTA.name||'';
  ROL=rolPorEmail(USUARIO.email);
  await resolverSitioYListas();
  await cargarDesdeSP();
  if(ROL==='conductor') prepararConductor();
  if(ROL==='supervisor'||ROL==='admin') await cargarRegistrosSP();
  render();
}
function logoutMS(){
  if(msal&&!MODO_DEMO){ msal.logoutPopup().catch(()=>{}); }
  CUENTA=null;TOKEN=null;ROL=null;USUARIO={nombre:'',email:''};REGISTROS=[];PANTALLA=0;F=nuevoRegistro();
  render();
}
function rolPorEmail(email){
  if(email===CONFIG.adminEmail.toLowerCase()) return 'admin';
  if(email===CONFIG.supervisorEmail.toLowerCase()) return 'supervisor';
  return 'conductor';
}

// ============ GRAPH ============
async function graph(url,method,body){
  const tok=await getToken();
  const r=await fetch("https://graph.microsoft.com/v1.0"+url,{
    method:method||'GET',
    headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},
    body:body?JSON.stringify(body):undefined
  });
  if(!r.ok){ const t=await r.text(); throw new Error("Graph "+r.status+": "+t.slice(0,120)); }
  return r.status===204?null:r.json();
}
async function resolverSitioYListas(){
  const site=await graph(`/sites/${CONFIG.spHost}:${CONFIG.spPath}`);
  SITE_ID=site.id;
  const lists=await graph(`/sites/${SITE_ID}/lists?$select=id,displayName`);
  (lists.value||[]).forEach(l=>{
    for(const [k,name] of Object.entries(CONFIG.listas)) if(l.displayName===name) LIST_IDS[k]=l.id;
  });
}
async function listItems(key){
  const r=await graph(`/sites/${SITE_ID}/lists/${LIST_IDS[key]}/items?$expand=fields&$top=2000`);
  return (r.value||[]).map(it=>({_id:it.id,...it.fields}));
}
async function crearItem(key,fields){
  return graph(`/sites/${SITE_ID}/lists/${LIST_IDS[key]}/items`,'POST',{fields});
}
async function actualizarItem(key,itemId,fields){
  return graph(`/sites/${SITE_ID}/lists/${LIST_IDS[key]}/items/${itemId}/fields`,'PATCH',fields);
}

// ============ CARGA DE DATOS ============
async function cargarDesdeSP(){
  try{
    const [cond,rutas,paras]=await Promise.all([listItems('conductores'),listItems('rutas'),listItems('paraderos')]);
    const parByRuta={};
    paras.filter(p=>String(p.Activo)!=='No').sort((a,b)=>(+a.Orden||0)-(+b.Orden||0))
      .forEach(p=>{(parByRuta[String(p.CodigoRuta)]=parByRuta[String(p.CodigoRuta)]||[]).push(p.Paradero);});
    DATA.rutas=rutas.filter(r=>String(r.Activo)!=='No').map(r=>({
      codigo:String(r.Title),site:r.Site,placa:r.Placa,unidad:r.Unidad||'',cap:+r.Capacidad||0,
      ruta:r.RutaDescripcion||'',paraderos:parByRuta[String(r.Title)]||[]}));
    DATA.conductores=cond.filter(c=>String(c.Activo)!=='No').map(c=>({nombre:c.Title,email:(c.Email||'').toLowerCase()}));
    // puntos de almuerzo (lista opcional)
    if(LIST_IDS.puntosalmuerzo){
      try{ const pa=await listItems('puntosalmuerzo');
        const activos=pa.filter(x=>String(x.Activo)!=='No').sort((a,b)=>(+a.Orden||0)-(+b.Orden||0)).map(x=>x.Title);
        if(activos.length) PUNTOS_ALMUERZO=activos;
      }catch(e){ console.warn('sin lista PuntosAlmuerzo, uso fijos'); }
    }
    // programación diaria del día de hoy (lista opcional)
    if(LIST_IDS.programacion){
      try{ const pr=await listItems('programacion'); const hoy=hoyISO();
        const items=pr.filter(x=>String(x.Fecha||'').slice(0,10)===hoy).map(x=>({
          codigo:String(x.CodigoRuta),placa:x.Placa||'',estado:String(x.EstadoUnidad||'').toUpperCase(),
          campamento:x.Campamento||'',ruta:x.RutaDescripcion||'',conductor:x.Conductor||'',turno:String(x.Turno||'DIA').toUpperCase()}));
        if(items.length) PROGRAMACION={fecha:hoy,items};
      }catch(e){ console.warn('sin lista ProgramacionDiaria'); }
    }
    ORIGEN='sharepoint';
  }catch(e){
    console.warn('SP no disponible, uso datos locales:',e.message);
    DATA.rutas=RUTAS; DATA.conductores=CONDUCTORES_DB; ORIGEN='local';
  }
}
async function cargarRegistrosSP(){
  try{
    const regs=await listItems('registros');
    REGISTROS=regs.filter(r=>r.Title&&r.Title.indexOf('EJEMPLO')<0).map(mapRegSP);
  }catch(e){ console.warn('No pude leer registros:',e.message); }
}
function mapRegSP(r){
  return {id:r.Title,itemId:r._id,fecha:(r.Fecha||'').slice(0,10)||hoyISO(),conductor:r.Conductor,
    placa:r.Placa,site:r.Site,codigo:String(r.CodigoRuta),ruta:r.RutaDescripcion,cap:+r.Capacidad||0,
    direccion:r.Direccion,total:+r.TotalPersonal||0,ocup:+r.Ocupabilidad||0,
    servicios:+r.NumServicios||1,turno:r.Turno,almuerzo:r.Almuerzo,estado:r.Estado||'Pendiente',
    conductorEmail:(r.ConductorEmail||'').toLowerCase(),detalle:[],ts:r.Created||''};
}

// Identidad automática: buscar al conductor por su correo
function prepararConductor(){
  const yo=DATA.conductores.find(c=>c.email===USUARIO.email);
  USUARIO.nombre = yo?yo.nombre:(USUARIO.nombre||USUARIO.email);
  F=nuevoRegistro(); F.conductor=USUARIO.nombre; F.conductorEmail=USUARIO.email;
  PANTALLA=0;
}




// =========================================================
//  MODELO
// =========================================================
function nuevoRegistro(){
  return {id:null,fecha:hoyISO(),conductor:'',conductorEmail:'',site:'',codigo:'',placa:'',cap:0,
    direccion:'',turno:'',almuerzo:false,conteo:{},conteoAlm:{},estado:'Pendiente',
    cambioUnidad:false,placaReal:'',capReal:0};
}
function turnoRuta(cod){const r=rutaPorCodigo(cod);return r&&r.turno?r.turno:'DIA';}
function turnoLabel(t){return t==='NOCHE'?'Noche':'Día';}
// Puntos de almuerzo (fijos). Se sobreescriben desde la lista SharePoint "PuntosAlmuerzo" si existe.
let PUNTOS_ALMUERZO = ["WTP Oeste (Plataforma 1 y 2)","WTP Este (Plataforma 1 y 2)","Carpas Comedor"];
// Flota completa (placa → capacidad) para reemplazos de unidad
function flotaPlacas(){
  const m={};
  DATA.rutas.forEach(r=>{ if(r.placa && !(r.placa in m)) m[r.placa]={cap:r.cap,unidad:r.unidad||''}; });
  return m;
}
// Placa y capacidad efectivas del registro (titular o reemplazo)
function placaEfectiva(){ return F.cambioUnidad&&F.placaReal ? F.placaReal : F.placa; }
function capEfectiva(){
  if(F.cambioUnidad&&F.placaReal){ const f=flotaPlacas()[F.placaReal]; return f?f.cap:F.cap; }
  return F.cap;
}
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fechaBonita(iso){const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return dias[dt.getDay()]+' '+d+' '+meses[m-1];}
function numSemana(iso){const [y,m,d]=iso.split('-').map(Number);const on=new Date(Date.UTC(y,m-1,d));
  const day=on.getUTCDay()||7;on.setUTCDate(on.getUTCDate()+4-day);const ys=new Date(Date.UTC(on.getUTCFullYear(),0,1));
  return Math.ceil((((on-ys)/86400000)+1)/7);}
function rutaPorCodigo(cod){return DATA.rutas.find(r=>r.codigo===cod);}
function rutasDeSite(site){return DATA.rutas.filter(r=>r.site===site).sort((a,b)=>(+a.codigo||9999)-(+b.codigo||9999));}
function siteLabel(id){const s=SITES.find(x=>x.id===id);return s?s.lab:id;}
function esc(s){return String(s).replace(/"/g,'&quot;');}
function getColor(p){if(p<0.4)return '#4a9fd4';if(p<0.75)return '#2fbf71';if(p<=1.0)return '#f2a900';return '#e5484d';}

async function esperarMsal(intentos){
  // espera hasta que la librería MSAL del CDN esté disponible (máx ~5s)
  for(let i=0;i<(intentos||50);i++){
    if(window.msal && window.msal.PublicClientApplication) return true;
    await new Promise(r=>setTimeout(r,100));
  }
  return false;
}
async function iniciar(){
  if(MODO_DEMO){
    // demo sin login: datos locales, elige perfil manual
    DATA.rutas=RUTAS; DATA.conductores=CONDUCTORES_DB; ORIGEN='local';
    render(); return;
  }
  render();               // muestra pantalla de login mientras carga MSAL
  const cargó = await esperarMsal();
  if(!cargó){
    toast('No se pudo cargar el inicio de sesión de Microsoft. Revisa tu conexión y recarga.','err');
    return;
  }
  if(!initMsal()) return;
  const ok=await trySilentLogin();  // intenta reanudar sesión recordada
  if(!ok) render();
}

let _ultimaVista='';
function render(opts){
  const noScroll = opts && opts.noScroll;
  const hdr=document.getElementById('hdr'),abar=document.getElementById('abar');
  const app=document.getElementById('app');app.className='wrap fadein';

  // Sin sesión (o demo sin rol) → login / selección
  if(!ROL){ hdr.classList.add('hidden');abar.classList.add('hidden');app.innerHTML=vistaLogin();enganchar();return; }

  hdr.classList.remove('hidden');
  const pill=document.getElementById('modepill');
  pill.className='modepill '+(ROL==='conductor'?'cond':'sup');
  pill.textContent = ROL==='admin'?'Administrador':(ROL==='supervisor'?'Supervisor':'Conductor');

  if(ROL==='supervisor'||ROL==='admin'){abar.classList.add('hidden');pintarPasos(true);app.innerHTML=vistaSupervisor();enganchar();
    scrollSiCambia('sup-'+VISTA_SUP,noScroll);return;}

  abar.classList.remove('hidden');pintarPasos();
  if(PANTALLA===0)app.innerHTML=vistaConductor();
  else if(PANTALLA===1)app.innerHTML=vistaServicio();
  else if(PANTALLA===2)app.innerHTML=vistaParaderos();
  else app.innerHTML=vistaRevision();
  pintarAcciones();enganchar();
  scrollSiCambia('cond-'+PANTALLA,noScroll);
}
// Solo sube al tope cuando de verdad cambiamos de pantalla, no en cada redibujo
function scrollSiCambia(vista,noScroll){
  if(noScroll) return;
  if(vista!==_ultimaVista){ window.scrollTo(0,0); _ultimaVista=vista; }
}
function pintarPasos(hide){const s=document.getElementById('steps');
  if(hide){s.innerHTML='';return;}
  s.innerHTML=[0,1,2,3].map(i=>{let c='step';if(i<PANTALLA)c+=' done';else if(i===PANTALLA)c+=' cur';return `<div class="${c}"></div>`;}).join('');}

function bloqueCambioUnidad(){
  const rutaCap = F.cap;
  let selBloque='';
  if(F.cambioUnidad){
    const flota=flotaPlacas();
    const placas=Object.keys(flota).sort();
    const opts=placas.map(p=>`<option value="${p}"${F.placaReal===p?' selected':''}>${p} · ${flota[p].cap} pers.${flota[p].unidad?' · '+flota[p].unidad:''}</option>`).join('');
    let aviso='';
    if(F.placaReal){
      const cr=flota[F.placaReal]?flota[F.placaReal].cap:rutaCap;
      const dif = cr!==rutaCap;
      aviso=`<p class="hint" style="margin-top:8px">Registro con placa <b>${F.placaReal}</b> (capacidad <b>${cr}</b>)${dif?`, distinta a la titular ${F.placa} (${rutaCap})`:''}. La ruta y su código se mantienen.</p>`;
    }
    selBloque=`
      <div style="height:12px"></div>
      <label class="fld">Placa de la unidad usada <span class="req">*</span></label>
      <select class="big ${F.placaReal?'filled':''}" id="selPlacaReal">
        <option value="">— Selecciona la placa real —</option>${opts}
      </select>${aviso}`;
  }
  return `
    <div style="height:18px"></div>
    <label class="fld">¿Cambiaste de unidad?</label>
    <div class="chips">
      <button class="chip ${F.cambioUnidad?'on':''}" data-cu="1">Sí, otra unidad<small>Elegir placa real</small></button>
      <button class="chip ${!F.cambioUnidad?'on':''}" data-cu="0">No, la titular<small>${F.placa||'—'}</small></button>
    </div>

}

function bloqueAlmuerzos(){
  const pts=PUNTOS_ALMUERZO.length?PUNTOS_ALMUERZO:['Comedor'];
  const html=pts.map((p,i)=>{const c=F.conteoAlm[p]||{n:null};const filled=(c.n!==null);
    return `<div class="par ${filled?'filled':''}">
      <div class="par-top"><span class="par-ord" style="background:var(--amber);color:#111">${i+1}</span><span class="par-name">${p}</span></div>
      <div class="stepline" style="gap:10px">
        <button class="sbtn" data-pa="${esc(p)}" data-da="-1">−</button>
        <input class="sin" data-pan="${esc(p)}" inputmode="numeric" value="${c.n??''}" placeholder="0" style="font-size:26px;height:48px">
        <button class="sbtn plus" data-pa="${esc(p)}" data-da="1">+</button>
        <div style="flex:1;text-align:left;font-size:12px;color:var(--muted);font-weight:600">almuerzos</div>
      </div></div>`;}).join('');
  const tot=totalAlmuerzos();
  return `<div style="height:12px"></div>
    <label class="fld" style="color:var(--amber)">Almuerzos por punto</label>
    <p class="hint" style="margin:0 0 10px">Cuántos almuerzos en cada plataforma y comedor.</p>
    ${html}
    <div class="gauge" style="margin-top:8px"><div class="gtags" style="margin:0">
      <div class="gtag">Total almuerzos <b style="color:var(--amber)" id="totAlmView">${tot}</b></div></div></div>`;
}
function totalAlmuerzos(){let t=0;Object.values(F.conteoAlm).forEach(c=>{t+=(+c.n||0);});return t;}
function totales(){let tot=0;Object.values(F.conteo).forEach(c=>{tot+=(+c.n||0);});return {tot};}
function ocupabilidad(r){const cap=capEfectiva()||(r?r.cap:0);if(!cap)return 0;return totales().tot/cap;}
function gaugeParaderos(r){
  const {tot}=totales();const any=Object.keys(F.conteo).length>0;
  if(!any)return `<div class="gauge" id="gaugeRuta"><div class="gauge-top"><span class="gauge-lab">Ocupabilidad</span>
    <span class="gauge-val" style="color:var(--dim)">—</span></div><div class="bar"><div class="bar-fill"></div></div>
    <div class="gtags"><span class="gtag">Ingresa el conteo para ver el índice</span></div></div>`;
  const oc=ocupabilidad(r);const col=getColor(oc);
  return `<div class="gauge" id="gaugeRuta"><div class="gauge-top"><span class="gauge-lab">Ocupabilidad · ${F.direccion==='SUBIDA'?'subida':'bajada'}</span>
    <span class="gauge-val" style="color:${col}">${(oc*100).toFixed(0)}<small>%</small></span></div>
    <div class="bar"><div class="bar-fill" style="width:${Math.min(oc*100,100)}%;background:${col}"></div><div class="bar-100"></div></div>
    <div class="gtags"><span class="gtag">Total personal <b>${tot}</b></span><span class="gtag">Capacidad <b>${capEfectiva()||r.cap}</b></span></div></div>`;
}

//  ENVÍO (conductor)
// =========================================================
async function enviar(){
  const reg=construirRegistro();
  let okSP=false;
  if(!MODO_DEMO && SITE_ID && LIST_IDS.registros){
    try{ await spCrearRegistro(reg); okSP=true; }
    catch(e){ console.warn('No pude escribir en SP:',e.message); toast('Guardado local (SP falló)','err'); }
  }
  REGISTROS.push(reg);
  if(okSP) toast('✓ Enviado a SharePoint');
  else if(MODO_DEMO) toast('✓ Registro guardado (demo)');
  const site=F.site;
  F=nuevoRegistro();F.conductor=USUARIO.nombre;F.conductorEmail=USUARIO.email;F.site=site;
  PANTALLA=1;render();
}
function construirRegistro(){
  const r=rutaPorCodigo(F.codigo);const {tot}=totales();const oc=ocupabilidad(r);
  const pars=r.paraderos.length?r.paraderos:['Origen','Destino'];
  const detalle=pars.map((p,i)=>{const c=F.conteo[p]||{n:0};return {paradero:p,orden:i+1,n:+c.n||0};});
  const placaUsada=placaEfectiva(); const capUsada=capEfectiva();
  const almDetalle = F.almuerzo ? PUNTOS_ALMUERZO.map((p,i)=>({punto:p,orden:i+1,n:+(F.conteoAlm[p]&&F.conteoAlm[p].n)||0})).filter(x=>x.n>0) : [];
  const totAlm = almDetalle.reduce((a,x)=>a+x.n,0);
  return {id:'REG-'+F.fecha.replace(/-/g,'')+'-'+Date.now().toString().slice(-6),fecha:F.fecha,
    conductor:F.conductor,conductorEmail:F.conductorEmail,placa:placaUsada,placaTitular:r.placa,
    cambioUnidad:F.cambioUnidad&&!!F.placaReal,site:F.site,codigo:F.codigo,ruta:r.ruta,
    cap:capUsada,direccion:F.direccion,total:tot,ocup:oc,servicios:1,turno:r.turno,
    almuerzo:F.almuerzo?'APLICA':'NO APLICA',totAlmuerzos:totAlm,almDetalle,
    estado:'Pendiente',detalle,ts:new Date().toISOString()};
}
async function spCrearRegistro(reg){
  const res=await crearItem('registros',{
    Title:reg.id,Fecha:reg.fecha,Conductor:reg.conductor,ConductorEmail:reg.conductorEmail,Placa:reg.placa,
    PlacaTitular:reg.placaTitular,CambioUnidad:reg.cambioUnidad?'Sí':'No',
    Site:reg.site,CodigoRuta:reg.codigo,RutaDescripcion:reg.ruta,Capacidad:reg.cap,Direccion:reg.direccion,
    TotalPersonal:reg.total,Ocupabilidad:reg.ocup,NumServicios:reg.servicios,
    Turno:reg.turno,Almuerzo:reg.almuerzo,TotalAlmuerzos:reg.totAlmuerzos||0,Estado:'Pendiente'});
  reg.itemId=res&&res.id;
  if(LIST_IDS.detalle){
    for(const d of reg.detalle){
      try{ await crearItem('detalle',{Title:reg.id+'-'+d.orden,RegistroID:reg.id,CodigoRuta:reg.codigo,
        Paradero:d.paradero,Orden:d.orden,Personal:d.n,Direccion:reg.direccion,Tipo:'RUTA'}); }
      catch(e){ console.warn('detalle falló',e.message); }
    }
    for(const a of (reg.almDetalle||[])){
      try{ await crearItem('detalle',{Title:reg.id+'-ALM-'+a.orden,RegistroID:reg.id,CodigoRuta:reg.codigo,
        Paradero:a.punto,Orden:a.orden,Personal:a.n,Direccion:reg.direccion,Tipo:'ALMUERZO'}); }
      catch(e){ console.warn('detalle almuerzo falló',e.message); }
    }
  }
}

// =========================================================
//  VISTA SUPERVISOR / ADMIN
// =========================================================
function vistaSupervisor(){
  const cab=`
  <div class="savedbar">
    <div class="cnt" style="color:var(--violet)">${REGISTROS.filter(r=>r.fecha===hoyISO()).length}</div>
    <div class="lbl">registros · <b>${fechaBonita(hoyISO())}</b><br><span style="font-size:11px">${USUARIO.nombre||USUARIO.email}</span></div>
    <button class="linkbtn" onclick="logoutMS()">Salir</button>
  </div>
  <div class="filtro" style="margin-bottom:6px">
    <button class="fbtn ${VISTA_SUP==='validar'?'on':''}" data-vsup="validar" style="flex:1">✓ Validar</button>
    <button class="fbtn ${VISTA_SUP==='prog'?'on':''}" data-vsup="prog" style="flex:1">📋 Programación</button>
  </div>`;
  return cab + (VISTA_SUP==='prog' ? panelProgramacion() : panelValidar());
}

function panelValidar(){
  const hoy=REGISTROS.filter(r=>r.fecha===hoyISO());
  const lista=hoy.length?hoy:REGISTROS;
  const pend=lista.filter(r=>r.estado==='Pendiente').length;
  const aprob=lista.filter(r=>r.estado==='Aprobado').length;
  const servicios=lista.filter(r=>r.estado==='Aprobado').reduce((a,r)=>a+(r.servicios||1),0);
  let items=lista.slice();
  if(FILTRO_SUP==='pend')items=items.filter(r=>r.estado==='Pendiente');
  else if(FILTRO_SUP==='aprob')items=items.filter(r=>r.estado==='Aprobado');
  items.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  const cards=items.length?items.map(cardSup).join(''):`<div class="empty">No hay registros ${FILTRO_SUP==='pend'?'pendientes':FILTRO_SUP==='aprob'?'aprobados':''} todavía.</div>`;
  const puedeAdmin = ROL==='admin';
  return `
  <div class="kpis">
    <div class="kpi a"><div class="n">${pend}</div><div class="l">Pendientes</div></div>
    <div class="kpi g"><div class="n">${aprob}</div><div class="l">Aprobados</div></div>
    <div class="kpi b"><div class="n">${servicios}</div><div class="l">Servicios</div></div>
  </div>
  <div class="filtro">
    <button class="fbtn ${FILTRO_SUP==='todos'?'on':''}" data-filtro="todos">Todos</button>
    <button class="fbtn ${FILTRO_SUP==='pend'?'on':''}" data-filtro="pend">Pendientes</button>
    <button class="fbtn ${FILTRO_SUP==='aprob'?'on':''}" data-filtro="aprob">Aprobados</button>
  </div>
  ${cards}
  <div style="display:flex;gap:9px;margin:16px 0">
    <button class="btn btn-primary" style="height:50px" onclick="exportarCSV()">⬇ Exportar aprobados</button>
    <button class="btn btn-ghost" style="width:auto;padding:0 16px;height:50px" onclick="copiarTabla()">Copiar</button>
  </div>
  <p class="srcnote">Fuente: <b>${ORIGEN==='sharepoint'?'SharePoint':'local (demo)'}</b>${puedeAdmin?' · Rol admin':''}</p>`;
}

function panelProgramacion(){
  if(!PROGRAMACION||!PROGRAMACION.items.length){
    return `<div class="empty">No hay programación cargada para hoy.<br><span style="font-size:12px">Sube la ProgramacionDiaria del día a SharePoint para ver qué rutas faltan reportar.</span></div>`;
  }
  // filtrar filas válidas: con código real (no "-", no vacío, no SIN SERVICIO)
  const validos=PROGRAMACION.items.filter(p=>{
    const c=String(p.codigo||'').trim();
    return c && c!=='-' && /\d/.test(c) && (p.ruta||'').toUpperCase().indexOf('SIN SERVICIO')<0;
  });
  // deduplicar por código (un código cuenta una vez; conserva la primera aparición, marca si tiene día+noche)
  const porCodigo={};
  validos.forEach(p=>{
    const c=String(p.codigo);
    if(!porCodigo[c]) porCodigo[c]={...p,turnos:new Set([p.turno])};
    else porCodigo[c].turnos.add(p.turno);
  });
  const unicos=Object.values(porCodigo);
  const programadas=unicos.filter(p=>p.estado.indexOf('NO')<0);
  const noProg=unicos.filter(p=>p.estado.indexOf('NO')>=0);
  const reportados=new Set(REGISTROS.filter(r=>r.fecha===hoyISO()).map(r=>String(r.codigo)));
  const faltantes=programadas.filter(p=>!reportados.has(String(p.codigo)));
  const reportadasProg=programadas.filter(p=>reportados.has(String(p.codigo)));
  const pct = programadas.length? Math.round(reportadasProg.length/programadas.length*100):0;
  const col = pct>=100?'var(--green)':pct>=60?'var(--amber)':'var(--red)';

  let lista, etiqueta;
  if(FILTRO_SUP==='reportadas'){ lista=reportadasProg; etiqueta='reportadas'; }
  else if(FILTRO_SUP==='faltantes'){ lista=faltantes; etiqueta='faltantes'; }
  else { lista=programadas; etiqueta='programadas'; }

  const filas = lista.length? lista.sort((a,b)=>(+a.codigo||0)-(+b.codigo||0)).map(p=>{
    const rep=reportados.has(String(p.codigo));
    const ambosTurnos = p.turnos && p.turnos.size>1;
    return `<div class="regc" style="padding:11px 13px">
      <div class="regc-h" style="margin-bottom:4px">
        <span class="regc-cod">${p.codigo}</span>
        <span class="badge ${rep?'aprob':'pend'}">${rep?'Reportada':'Falta'}</span>
        <span style="margin-left:auto;font-size:12px;color:var(--muted)">${ambosTurnos?'Día+Noche':(p.turno==='NOCHE'?'Noche':'Día')}</span>
      </div>
      <div class="regc-m" style="font-size:12.5px">${p.placa||'—'} · ${p.ruta||''}${p.conductor?'<br>'+p.conductor:''}</div>
    </div>`;}).join('')
    : `<div class="empty">Ninguna ruta ${etiqueta}.</div>`;

  return `
  <div class="gauge" style="margin:4px 0 14px">
    <div class="gauge-top"><span class="gauge-lab">Avance del día · rutas reportadas</span>
      <span class="gauge-val" style="color:${col}">${pct}<small>%</small></span></div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
    <div class="gtags"><span class="gtag">Reportadas <b>${reportadasProg.length}/${programadas.length}</b></span>
      <span class="gtag">No programadas <b>${noProg.length}</b></span></div>
  </div>
  <div class="kpis">
    <div class="kpi b"><div class="n">${programadas.length}</div><div class="l">Programadas</div></div>
    <div class="kpi g"><div class="n">${reportadasProg.length}</div><div class="l">Reportadas</div></div>
    <div class="kpi a"><div class="n">${faltantes.length}</div><div class="l">Faltan</div></div>
  </div>
  <div class="filtro">
    <button class="fbtn ${FILTRO_SUP==='todos'?'on':''}" data-filtro="todos">Programadas</button>
    <button class="fbtn ${FILTRO_SUP==='reportadas'?'on':''}" data-filtro="reportadas">Reportadas</button>
    <button class="fbtn ${FILTRO_SUP==='faltantes'?'on':''}" data-filtro="faltantes">Faltantes</button>
  </div>
  ${filas}
  <p class="srcnote" style="margin-top:14px">Programación del <b>${fechaBonita(PROGRAMACION.fecha)}</b> · fuente <b>${ORIGEN==='sharepoint'?'SharePoint':'local (demo)'}</b></p>`;
}
function cardSup(r){
  const oc=(r.ocup*100).toFixed(0);const col=getColor(r.ocup);const ap=r.estado==='Aprobado';
  return `<div class="regc ${ap?'aprob':''}">
    <div class="regc-h"><span class="regc-cod">${r.codigo}</span>
      <span class="badge ${ap?'aprob':'pend'}">${ap?'Aprobado':'Pendiente'}</span>
      <span class="regc-oc" style="color:${col}">${oc}%</span></div>
    <div class="regc-m"><b>${r.conductor}</b> · ${r.placa}${r.cambioUnidad?' <span style="color:var(--amber);font-weight:700">⚠ reemplazo</span>':''}<br>
      ${siteLabel(r.site)} · ${r.direccion==='SUBIDA'?'Subida':'Bajada'} · ${r.turno==='NOCHE'?'Noche':'Día'}<br>
      ${r.total} personas · cap ${r.cap}${r.cambioUnidad&&r.placaTitular?' · titular '+r.placaTitular:''}</div>
    <div class="regc-acts">
      <button class="be" onclick="verDetalle('${r.id}')">Ver / Editar</button>
      ${ap?`<button class="be" onclick="cambiarEstado('${r.id}','Pendiente')">Reabrir</button>`
          :`<button class="ba" onclick="cambiarEstado('${r.id}','Aprobado')">✓ Aprobar</button>`}
    </div></div>`;
}
function regById(id){return REGISTROS.find(r=>r.id===id);}
async function cambiarEstado(id,estado){
  const r=regById(id);if(!r)return;r.estado=estado;
  if(!MODO_DEMO && r.itemId && LIST_IDS.registros){
    try{ await actualizarItem('registros',r.itemId,{Estado:estado,RevisadoPor:USUARIO.email,FechaRevision:new Date().toISOString()}); }
    catch(e){ console.warn('No pude actualizar estado:',e.message); }
  }
  toast(estado==='Aprobado'?'✓ Aprobado':'Reabierto');render();
}
function verDetalle(id){
  const r=regById(id);if(!r)return;
  document.getElementById('modalTitle').textContent=r.codigo+' · '+r.conductor;
  const rutaObj=rutaPorCodigo(r.codigo)||{paraderos:[]};
  const pars=r.detalle&&r.detalle.length?r.detalle:(rutaObj.paraderos.length?rutaObj.paraderos:['Origen','Destino']).map((p,i)=>({paradero:p,orden:i+1,n:0}));
  const parRows=pars.map((d,i)=>`<div class="par">
    <div class="par-top"><span class="par-ord">${i+1}</span><span class="par-name">${d.paradero}</span></div>
    <div class="stepline" style="gap:10px">
      <input class="sin" data-edit="${id}" data-i="${i}" data-f="n" inputmode="numeric" value="${d.n||0}" style="height:46px">
      <div style="flex:1;text-align:left;font-size:12px;color:var(--muted);font-weight:600">personas</div>
    </div></div>`).join('');
  document.getElementById('modalBody').innerHTML=`
    <div class="review" style="margin-bottom:14px">
      <div class="rrow"><span class="rk">Placa</span><span class="rv">${r.placa}</span></div>
      <div class="rrow"><span class="rk">Dirección</span><span class="rv">${r.direccion==='SUBIDA'?'Subida':'Bajada'}</span></div>
      <div class="rrow"><span class="rk">Capacidad</span><span class="rv">${r.cap}</span></div>
      <div class="rrow"><span class="rk">Estado</span><span class="rv">${r.estado}</span></div></div>
    <label class="fld">Corregir conteo por paradero</label>${parRows}
    <div style="display:flex;gap:9px;margin-top:16px">
      <button class="btn btn-ghost" style="width:auto;flex:1" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicion('${id}')">Guardar cambios</button></div>`;
  document.getElementById('modal').classList.add('show');
  document.querySelectorAll('[data-edit]').forEach(inp=>inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9]/g,'');});
}
async function guardarEdicion(id){
  const r=regById(id);if(!r)return;
  const pars=r.detalle&&r.detalle.length?r.detalle:[];
  document.querySelectorAll(`[data-edit="${id}"]`).forEach(inp=>{const i=+inp.dataset.i,f=inp.dataset.f,v=+inp.value||0;if(pars[i])pars[i][f]=v;});
  r.total=pars.reduce((a,d)=>a+(+d.n||0),0);r.ocup=r.cap?r.total/r.cap:0;r.detalle=pars;
  if(!MODO_DEMO && r.itemId && LIST_IDS.registros){
    try{ await actualizarItem('registros',r.itemId,{TotalPersonal:r.total,Ocupabilidad:r.ocup}); }
    catch(e){ console.warn('No pude actualizar:',e.message); }
  }
  cerrarModal();toast('✓ Cambios guardados');render();
}
function cerrarModal(){document.getElementById('modal').classList.remove('show');}

// =========================================================
//  EXPORTACIÓN
// =========================================================
const CABECERAS=['FECHA','DIA','SEMANA','SITE','CODIFICACION','RUTA','PLACA','PLACA TITULAR','CAMBIO UNIDAD','CAPACIDAD','DIRECCION',
  'TOTAL PERSONAL','OCUPABILIDAD','N° SERVICIOS','TURNO','ALMUERZO','TOTAL ALMUERZOS','ESTADO','CONDUCTOR','CORREO','REGISTRADO'];
function filaArr(r){const dias=['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const [y,m,d]=r.fecha.split('-').map(Number);
  return [r.fecha,dias[new Date(y,m-1,d).getDay()],numSemana(r.fecha),r.site,r.codigo,r.ruta,r.placa,r.placaTitular||r.placa,(r.cambioUnidad?'Sí':'No'),r.cap,r.direccion,
    r.total,r.ocup,r.servicios||1,r.turno,r.almuerzo,r.totAlmuerzos||0,r.estado,r.conductor,r.conductorEmail||'',r.ts||''];}
function exportarCSV(){
  const aprob=REGISTROS.filter(r=>r.estado==='Aprobado');
  if(!aprob.length){toast('No hay aprobados aún','err');return;}
  const rows=[CABECERAS.join(';')];
  aprob.forEach(r=>rows.push(filaArr(r).map(v=>typeof v==='number'?String(v).replace('.',','):'"'+String(v).replace(/"/g,'""')+'"').join(';')));
  const csv='\ufeff'+rows.join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='ocupabilidad_aprobados_'+hoyISO()+'.csv';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('✓ CSV descargado');
}
function copiarTabla(){
  const aprob=REGISTROS.filter(r=>r.estado==='Aprobado');
  if(!aprob.length){toast('No hay aprobados','err');return;}
  const rows=[CABECERAS.join('\t')];
  aprob.forEach(r=>rows.push(filaArr(r).map(v=>typeof v==='number'?String(v).replace('.',','):v).join('\t')));
  navigator.clipboard?.writeText(rows.join('\n')).then(()=>toast('✓ Copiado — pega en Excel'),()=>toast('No se pudo copiar','err'));
}

// =========================================================
//  EVENTOS
// =========================================================
function enganchar(){
  const sr=document.getElementById('selRuta');if(sr)sr.onchange=e=>{const r=rutaPorCodigo(e.target.value);F.codigo=e.target.value;F.placa=r?r.placa:'';F.cap=r?r.cap:0;F.cambioUnidad=false;F.placaReal='';F.conteo={};F.conteoAlm={};render();};
  document.querySelectorAll('[data-cu]').forEach(b=>b.onclick=()=>{F.cambioUnidad=b.dataset.cu==='1';if(!F.cambioUnidad)F.placaReal='';render({noScroll:true});});
  const spr=document.getElementById('selPlacaReal');if(spr)spr.onchange=e=>{F.placaReal=e.target.value;render({noScroll:true});};
  document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{if(F.site!==b.dataset.site){F.site=b.dataset.site;F.codigo='';F.conteo={};F.conteoAlm={};}render();});
  document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{if(F.direccion!==b.dataset.dir){F.direccion=b.dataset.dir;F.conteo={};}render({noScroll:true});});
  document.querySelectorAll('[data-alm]').forEach(b=>b.onclick=()=>{F.almuerzo=b.dataset.alm==='1';render({noScroll:true});});
  document.querySelectorAll('[data-vsup]').forEach(b=>b.onclick=()=>{VISTA_SUP=b.dataset.vsup;FILTRO_SUP='todos';render();});
  document.querySelectorAll('[data-filtro]').forEach(b=>b.onclick=()=>{FILTRO_SUP=b.dataset.filtro;render();});
  document.querySelectorAll('[data-f]').forEach(b=>{if(b.dataset.d===undefined)return;
    b.onclick=()=>{const p=b.dataset.p.replace(/&quot;/g,'"'),d=+b.dataset.d;
      F.conteo[p]=F.conteo[p]||{n:null};let v=(F.conteo[p].n===null?0:F.conteo[p].n)+d;if(v<0)v=0;F.conteo[p].n=v;
      // actualizar solo el input de este paradero + gauge, sin redibujar todo
      const inp=document.querySelector('[data-pn="'+b.dataset.p+'"]'); if(inp)inp.value=v;
      const cont=b.closest('.par'); if(cont)cont.classList.add('filled');
      refrescarGaugeRuta(); pintarAcciones();};});
  document.querySelectorAll('[data-pn]').forEach(inp=>{
    const p=inp.dataset.pn.replace(/&quot;/g,'"');
    inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9]/g,'');F.conteo[p]=F.conteo[p]||{n:null};
      F.conteo[p].n=inp.value===''?null:parseInt(inp.value,10);
      refrescarGaugeRuta();pintarAcciones();};});
  // almuerzos por punto — actualiza in-situ, sin render (evita el salto de scroll)
  document.querySelectorAll('[data-pa]').forEach(b=>{
    b.onclick=()=>{const p=b.dataset.pa.replace(/&quot;/g,'"'),d=+b.dataset.da;
      F.conteoAlm[p]=F.conteoAlm[p]||{n:null};let v=(F.conteoAlm[p].n===null?0:F.conteoAlm[p].n)+d;if(v<0)v=0;F.conteoAlm[p].n=v;
      const inp=document.querySelector('[data-pan="'+b.dataset.pa+'"]'); if(inp)inp.value=v;
      const cont=b.closest('.par'); if(cont)cont.classList.add('filled');
      refrescarTotalAlm();};});
  document.querySelectorAll('[data-pan]').forEach(inp=>{
    const p=inp.dataset.pan.replace(/&quot;/g,'"');
    inp.oninput=()=>{inp.value=inp.value.replace(/[^0-9]/g,'');F.conteoAlm[p]=F.conteoAlm[p]||{n:null};
      F.conteoAlm[p].n=inp.value===''?null:parseInt(inp.value,10);refrescarTotalAlm();};});
}

// Actualiza solo el medidor de ocupabilidad de ruta, sin redibujar la pantalla
function refrescarGaugeRuta(){
  if(PANTALLA!==2)return;
  const r=rutaPorCodigo(F.codigo);const g=document.getElementById('gaugeRuta');
  if(g&&r)g.outerHTML=gaugeParaderos(r);
}
// Actualiza solo el total de almuerzos, sin redibujar la pantalla
function refrescarTotalAlm(){
  const el=document.getElementById('totAlmView');
  if(el)el.textContent=totalAlmuerzos();
}
